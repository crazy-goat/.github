name: Bug report
description: Something does not work as expected
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: Please write in English. Thanks for the report!
  # A repository may copy this form and add an "Area" dropdown with its main parts.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happens, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal example is best (code, config, command).
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste the full error. It is formatted as code automatically.
      render: text
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version, and runtime / OS version if relevant (for example PHP 8.4, Go 1.26, Ubuntu 24.04).
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where to start
      description: Files that are probably involved and the command that runs the related tests. Maintainers fill this in for `good first issue`.
    validations:
      required: false
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: How do we know it is fixed?
      placeholder: "- [ ] A test reproduces the bug and now passes"
    validations:
      required: false
