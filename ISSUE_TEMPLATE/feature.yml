name: Feature request
description: A new feature or an improvement
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: Please write in English. Thanks for the idea!
  # A repository may copy this form and add an "Area" dropdown with its main parts.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should be added or changed? An example of the API or config you would like helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you considered.
    validations:
      required: false
  - type: textarea
    id: where
    attributes:
      label: Where to start
      description: Files to change and the command that runs the related tests. Maintainers fill this in for `good first issue`.
    validations:
      required: false
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: Acceptance criteria.
      placeholder: |
        - [ ] Behaviour implemented
        - [ ] Tests added
        - [ ] Docs and CHANGELOG updated
    validations:
      required: false
